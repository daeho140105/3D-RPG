
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대장장이의 모험</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      background: #222b;
      padding: 15px;
      border-radius: 12px;
      z-index: 2;
    }
    #help {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: #222b;
      padding: 12px;
      border-radius: 10px;
      white-space: nowrap;
      z-index: 2;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <b>⚒️ 대장장이의 모험</b>
    <p>레벨: 1</p>
    <p>체력: 100 / 100</p>
    <p>무기: 나무 검</p>
  </div>
  <div id="help">WASD: 이동 | 마우스: 카메라 회전</div>

  <script type="module" src="./game.js"></script>
</body>
</html>
